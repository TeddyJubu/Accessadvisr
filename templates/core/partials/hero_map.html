<!-- templates/core/partials/hero_map.html -->
<section class="relative w-full h-[600px] bg-slate-100 overflow-hidden group">
    <div class="absolute inset-0 bg-cover bg-center"
        style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/e/ec/Map_of_New_York_City_location_map.jpg'); opacity: 0.8;">
    </div>
    <div class="absolute inset-0 bg-white/10 pointer-events-none"></div>

    <!-- Fake Markers -->
    <div class="absolute top-1/3 left-1/4 -translate-x-1/2 -translate-y-1/2">
        <div class="relative">
            <div
                class="w-12 h-12 bg-[#FF431E] rounded-full border-4 border-white shadow-lg flex items-center justify-center text-white font-bold">
                3</div>
            <div class="w-4 h-4 bg-[#FF431E] absolute -bottom-1 left-1/2 -translate-x-1/2 rotate-45"></div>
        </div>
    </div>

    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
        <div class="relative">
            <div class="w-12 h-12 overflow-hidden rounded-full border-4 border-white shadow-lg">
                <img src="https://accessadvisr.com/wp-content/uploads/2020/01/user-1-150x150.png"
                    class="w-full h-full object-cover" alt="">
            </div>
            <div class="w-4 h-4 bg-white absolute -bottom-1 left-1/2 -translate-x-1/2 rotate-45"></div>
        </div>
    </div>

    <div class="absolute bottom-1/3 right-1/4 -translate-x-1/2 -translate-y-1/2">
        <div
            class="w-10 h-10 bg-[#26354E] rounded-full border-4 border-white shadow-lg flex items-center justify-center text-white font-bold text-xs">
            2</div>
    </div>

    <!-- Controls (placeholders) -->
    <div class="absolute top-4 left-4 flex flex-col gap-2">
        <button class="bg-white p-2 rounded shadow hover:bg-gray-50 text-slate-600" aria-disabled="true"
            title="Map zoom controls are placeholders">
            <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
        <button class="bg-white p-2 rounded shadow hover:bg-gray-50 text-slate-600" aria-disabled="true"
            title="Map zoom controls are placeholders">
            <i data-lucide="minus" class="w-4 h-4"></i>
        </button>
    </div>
</section>
