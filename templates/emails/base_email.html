<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AccessAdvisr{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #334155;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
        }

        .email-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
        }

        .email-header {
            background-color: #26354E;
            padding: 24px;
            text-align: center;
        }

        .email-header img {
            height: 40px;
            width: auto;
        }

        .email-header h1 {
            color: #ffffff;
            font-size: 24px;
            margin: 16px 0 0;
        }

        .email-body {
            padding: 32px 24px;
        }

        .email-footer {
            background-color: #f1f5f9;
            padding: 24px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }

        .btn {
            display: inline-block;
            background-color: #FF431E;
            color: #ffffff !important;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin: 16px 0;
        }

        .btn:hover {
            background-color: #e03615;
        }

        .highlight-box {
            background-color: #f8fafc;
            border-left: 4px solid #FF431E;
            padding: 16px;
            margin: 16px 0;
        }

        .rating {
            color: #FF431E;
            font-size: 18px;
        }

        h2 {
            color: #26354E;
            margin-top: 0;
        }

        a {
            color: #FF431E;
        }
    </style>
</head>

<body>
    <div class="email-wrapper">
        <div class="email-header">
            <h1>AccessAdvisr</h1>
        </div>
        <div class="email-body">
            {% block content %}{% endblock %}
        </div>
        <div class="email-footer">
            <p>
                This email was sent by AccessAdvisr.<br>
                <a href="{{ site_url }}">Visit our website</a>
            </p>
            <p>
                © 2026 AccessAdvisr. Helping make the world more accessible.
            </p>
        </div>
    </div>
</body>

</html>
